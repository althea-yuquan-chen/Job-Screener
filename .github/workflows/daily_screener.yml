name: Daily Job Screener

on:
  schedule:
    # ~Midnight Eastern Time = 04:17 UTC during EDT (summer). Cron is fixed
    # to UTC, so this runs at ~12:00 AM EDT / 11:00 PM EST -- shift to
    # "17 5 * * *" if you want it pinned to ~12:00 AM during EST (winter)
    # instead. Minute offset (:17, not :00) is deliberate -- GitHub Actions
    # scheduled runs queue up heavily at the top of the hour, so an off-hour
    # minute avoids most of that delay.
    - cron: "17 4 * * *"   # Every day

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  screen-jobs:
    runs-on: ubuntu-latest
    # 360 is GitHub's hard cap for a job on hosted runners -- there's no way
    # to actually disable the limit, this is the maximum it can be raised to.
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js (for Claude Code CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Scoring/tailoring runs through the local Claude Code CLI in headless
      # mode (see src/claude_code_client.py) so it draws on a Claude
      # subscription's included usage instead of metered API billing.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Needed to compile tailored resume PDFs (src/tailor.py)
      - name: Install LaTeX (for tailored resume PDFs)
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended

      # Restore the seen-job-IDs file from previous run (stored as artifact).
      # Key bumped to v3 (v2 was cancelled mid-run under the OLD, all-at-
      # once main.py, which marks every deduped job "seen" before scoring
      # even starts -- if that cancelled run's cleanup step still saved a
      # cache, it would have poisoned v2 with ~5500 "seen" jobs that were
      # never actually scored. v3 guarantees a genuinely clean slate for the
      # rerun on the new incremental-write main.py. After this rerun
      # completes, behaves as a normal cache again.
      - name: Restore seen job IDs
        uses: actions/cache@v4
        with:
          path: .seen_job_ids.json
          key: seen-job-ids-v3-${{ github.run_id }}
          restore-keys: |
            seen-job-ids-v3-

      - name: Run job screener
        env:
          CLAUDE_CODE_OAUTH_TOKEN:    ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_CREDENTIALS_JSON:    ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID:            ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_DRIVE_FOLDER_ID:     ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python src/main.py

      # Save seen-job-IDs so tomorrow's run skips today's jobs
      - name: Save seen job IDs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .seen_job_ids.json
          key: seen-job-ids-v3-${{ github.run_id }}
