name: Daily Job Screener

on:
  # Schedule intentionally left disabled until a CLAUDE_CODE_OAUTH_TOKEN secret
  # (from `claude setup-token`, requires a Claude subscription) is in place and
  # a full end-to-end run has been verified -- re-enable once ready:
  # schedule:
  #   # 8:00 AM Eastern Time (UTC-4 in summer) = 12:00 UTC
  #   - cron: "0 12 * * 1-5"   # Weekdays only

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  screen-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js (for Claude Code CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Scoring/tailoring runs through the local Claude Code CLI in headless
      # mode (see src/claude_code_client.py) so it draws on a Claude
      # subscription's included usage instead of metered API billing.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Needed to compile tailored resume PDFs (src/tailor.py)
      - name: Install LaTeX (for tailored resume PDFs)
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended

      # Restore the seen-job-IDs file from previous run (stored as artifact)
      - name: Restore seen job IDs
        uses: actions/cache@v4
        with:
          path: .seen_job_ids.json
          key: seen-job-ids-${{ github.run_id }}
          restore-keys: |
            seen-job-ids-

      - name: Run job screener
        env:
          CLAUDE_CODE_OAUTH_TOKEN:    ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_CREDENTIALS_JSON:    ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID:            ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_DRIVE_FOLDER_ID:     ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python src/main.py

      # Save seen-job-IDs so tomorrow's run skips today's jobs
      - name: Save seen job IDs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .seen_job_ids.json
          key: seen-job-ids-${{ github.run_id }}
